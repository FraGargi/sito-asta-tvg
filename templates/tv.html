<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Tabellone TV</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 3px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #4B5563; border-radius: 4px; }
    </style>
</head>
<body class="bg-gray-900 text-white flex flex-col h-screen overflow-hidden select-none">
    
    <div class="bg-gray-950 border-b border-gray-800 py-2 px-4 text-center">
        <h1 id="tv-titolo" class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-400 tracking-widest uppercase"></h1>
    </div>

    <div id="main-content" class="flex flex-1 p-4 gap-4 overflow-hidden">
        <div class="flex-[3.5] overflow-hidden flex flex-col">
            <h2 class="text-lg font-bold mb-2 text-gray-400 flex items-center gap-2">🛡️ Squadre e Rose</h2>
            <div id="griglia-squadre" class="grid grid-cols-4 gap-3 flex-1"></div>
        </div>

        <div class="flex-[1] flex flex-col gap-4 overflow-hidden">
            <div class="flex-1 bg-gray-800 p-3 rounded-lg border border-gray-700 flex flex-col overflow-hidden">
                <h3 class="text-base font-bold mb-2 text-yellow-400">🛒 Ultimi Colpi</h3>
                <div id="lista-acquisti" class="space-y-2 flex-1 overflow-y-auto custom-scrollbar pr-1"></div>
            </div>
            <div class="flex-1 bg-gray-800 p-3 rounded-lg border border-blue-900 flex flex-col overflow-hidden">
                <h3 id="titolo-svincolati" class="text-base font-bold mb-2 text-blue-400">🔥 Top Svincolati (FVM)</h3>
                <div id="lista-svincolati" class="space-y-2 flex-1 overflow-y-auto custom-scrollbar pr-1"></div>
            </div>
        </div>
    </div>

    <!-- MODALE LIVE -->
    <div id="modal-asta-live" class="hidden fixed inset-0 bg-gray-950 z-50 flex flex-col justify-between p-8 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-blue-950 via-gray-950 to-gray-950">
        
        <div class="flex justify-between items-center border-b border-blue-900 pb-3">
            <div>
                <span class="bg-yellow-500 text-black font-black px-4 py-1.5 rounded-full text-xs uppercase tracking-widest shadow-lg animate-pulse">🔴 IN DIRETTA DALL'ASTA</span>
                <div id="live-ruolo-nome" class="text-5xl font-black uppercase mt-2 tracking-wide"></div>
            </div>
            <div class="text-right">
                <div class="text-gray-400 text-xs uppercase tracking-widest font-semibold">Offerta Attuale</div>
                <div class="text-6xl font-black text-green-400 font-mono" id="live-prezzo"></div>
            </div>
        </div>

        <div class="grid grid-cols-4 gap-4 items-center my-1">
            <div class="bg-gray-900 border-2 border-blue-800 p-4 rounded-xl shadow-xl text-center">
                <div class="text-blue-400 text-xs font-bold uppercase tracking-wider mb-1">Squadra Serie A</div>
                <div id="live-squadra" class="text-xl font-black uppercase text-white tracking-wide"></div>
            </div>

            <div class="bg-gray-900 border-2 border-amber-500 p-4 rounded-xl shadow-xl text-center">
                <div class="text-amber-400 text-xs font-bold uppercase tracking-wider mb-1">🏆 In Vantaggio</div>
                <div id="live-squadra-vantaggio" class="text-xl font-black uppercase text-yellow-300 tracking-wide">---</div>
            </div>

            <div class="bg-gray-900 border-2 border-red-800 p-4 rounded-xl shadow-xl text-center">
                <div class="text-red-400 text-xs font-bold uppercase tracking-wider mb-1">Timer</div>
                <div id="live-timer" class="text-4xl font-mono font-black text-red-500 tracking-wider">00:10</div>
            </div>

            <div class="bg-gray-900 border-2 border-yellow-800 p-4 rounded-xl shadow-xl text-center">
                <div class="text-yellow-400 text-xs font-bold uppercase tracking-wider mb-1">FVM Ufficiale</div>
                <div id="live-fvm" class="text-4xl font-black text-yellow-400"></div>
            </div>
        </div>

        <div class="mx-auto w-full max-w-6xl my-4 grid grid-cols-2 gap-4">
            <!-- Blocco Statistiche -->
            <div class="bg-gray-900 border border-blue-900 rounded-xl p-4 shadow-xl flex flex-col justify-center">
                <div class="text-blue-400 text-xs font-bold uppercase tracking-wider text-center mb-3">📊 Statistiche Stagione 2025/26</div>
                <div class="grid grid-cols-4 gap-2 text-center">
                    <div class="bg-gray-950 p-2 rounded border border-gray-800">
                        <div class="text-[10px] text-gray-400 uppercase font-bold">Presenze</div>
                        <div class="text-sm font-mono font-bold text-white" id="live-stat-pv">0</div>
                    </div>
                    <div class="bg-gray-950 p-2 rounded border border-gray-800">
                        <div class="text-[10px] text-gray-400 uppercase font-bold">Media Voto</div>
                        <div class="text-sm font-mono font-bold text-yellow-300" id="live-stat-mv">0</div>
                    </div>
                    <div class="bg-gray-950 p-2 rounded border border-gray-800">
                        <div class="text-[10px] text-gray-400 uppercase font-bold">Fanta Media</div>
                        <div class="text-sm font-mono font-bold text-green-400" id="live-stat-fm">0</div>
                    </div>
                    <div class="bg-gray-950 p-2 rounded border border-gray-800">
                        <div class="text-[10px] text-gray-400 uppercase font-bold" id="live-stat-gol-label">Gol</div>
                        <div class="text-sm font-mono font-bold text-cyan-300" id="live-stat-gol">0</div>
                    </div>
                    <div class="bg-gray-950 p-2 rounded border border-gray-800">
                        <div class="text-[10px] text-gray-400 uppercase font-bold">Assist</div>
                        <div class="text-sm font-mono font-bold text-blue-300" id="live-stat-ass">0</div>
                    </div>
                    <div class="bg-gray-950 p-2 rounded border border-gray-800">
                        <div class="text-[10px] text-gray-400 uppercase font-bold">Ammoniz.</div>
                        <div class="text-sm font-mono font-bold text-amber-400" id="live-stat-amm">0</div>
                    </div>
                    <div class="bg-gray-950 p-2 rounded border border-gray-800">
                        <div class="text-[10px] text-gray-400 uppercase font-bold">Espulsioni</div>
                        <div class="text-sm font-mono font-bold text-red-400" id="live-stat-esp">0</div>
                    </div>
                    <div class="bg-gray-950 p-2 rounded border border-gray-800">
                        <div class="text-[10px] text-gray-400 uppercase font-bold">FVM</div>
                        <div class="text-sm font-mono font-bold text-purple-300" id="live-stat-fvm">0</div>
                    </div>
                </div>
            </div>
    
            <!-- Blocco Rilanci -->
            <div class="bg-gray-900 border border-amber-600 rounded-xl p-4 shadow-xl flex flex-col">
                <div class="text-amber-400 text-xs font-bold uppercase tracking-wider text-center mb-2">⚡ Ultimi Rilanci</div>
                <div id="live-feed-rilanci" class="space-y-1.5 custom-scrollbar pr-1 text-xs flex-1 overflow-y-auto max-h-48"></div>
            </div>
        </div>
        
        <div></div>
    </div>

    <script>
        let countdownInterval;
        let ultimoTimerScadenza = 0;
        let ultimoSecondoSuonato = -1;
        let giocatoSuonoFine = false;
        let ultimoPrezzoNotificato = null;
        let ultimoIdGiocatoreInAsta = null;
        let ultimoRuoloChiamato = '';

        function playSound(type) {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!window.audioCtx) window.audioCtx = new AudioContext();
                const ctx = window.audioCtx;
                if (ctx.state === 'suspended') ctx.resume();

                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);
                const now = ctx.currentTime;

                if (type === 'tick') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(880, now);
                    gain.gain.setValueAtTime(0.8, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
                    osc.start(now); osc.stop(now + 0.08);
                } else if (type === 'end') {
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(300, now);
                    osc.frequency.exponentialRampToValueAtTime(150, now + 0.35);
                    gain.gain.setValueAtTime(1.0, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
                    osc.start(now); osc.stop(now + 0.35);
                } else if (type === 'bid') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(440, now);
                    osc.frequency.exponentialRampToValueAtTime(880, now + 0.15);
                    gain.gain.setValueAtTime(0.8, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                    osc.start(now); osc.stop(now + 0.15);
                }
            } catch (e) {}
        }

        function getColorRuolo(ruolo) {
            const r = (ruolo || '').trim().toUpperCase();
            if(r === 'P') return 'text-yellow-400'; 
            if(r === 'D') return 'text-green-400';
            if(r === 'C') return 'text-blue-400'; 
            if(r === 'A') return 'text-red-400';
            return 'text-white';
        }

        setInterval(async function aggiornaLive() {
            try {
                const resLive = await fetch('/api/live');
                const asta = await resLive.json();
                document.getElementById('tv-titolo').innerText = asta.nome_asta;
                const modalLive = document.getElementById('modal-asta-live');
                
                if (asta.attiva) {
                    modalLive.classList.remove('hidden');
                    if (asta.ruolo) ultimoRuoloChiamato = asta.ruolo;

                    if (asta.giocatore_id !== ultimoIdGiocatoreInAsta) {
                        ultimoIdGiocatoreInAsta = asta.giocatore_id;
                        ultimoPrezzoNotificato = asta.prezzo;
                        giocatoSuonoFine = false;
                        ultimoSecondoSuonato = -1;
                    } else if (asta.prezzo > ultimoPrezzoNotificato) {
                        ultimoPrezzoNotificato = asta.prezzo;
                        playSound('bid');
                    }

                    document.getElementById('live-ruolo-nome').innerHTML = `<span class="${getColorRuolo(asta.ruolo)}">[${asta.ruolo}]</span> ${asta.nome}`;
                    document.getElementById('live-squadra').innerText = asta.squadra_serie_a;
                    document.getElementById('live-squadra-vantaggio').innerText = asta.squadra_in_vantaggio || "Nessuna";
                    document.getElementById('live-prezzo').innerText = `${asta.prezzo} cr.`;
                    document.getElementById('live-fvm').innerText = asta.fvm;

                    // Popolamento statistiche
                    document.getElementById('live-stat-pv').innerText = asta.stat_pv || 0;
                    document.getElementById('live-stat-mv').innerText = asta.stat_mv || 0;
                    document.getElementById('live-stat-fm').innerText = asta.stat_fm || 0;
                    document.getElementById('live-stat-gol-label').innerText = asta.ruolo === 'P' ? 'Gol Subiti' : 'Gol Fatti';
                    document.getElementById('live-stat-gol').innerText = asta.ruolo === 'P' ? (asta.stat_gs || 0) : (asta.stat_gf || 0);
                    document.getElementById('live-stat-ass').innerText = asta.stat_ass || 0;
                    document.getElementById('live-stat-amm').innerText = asta.stat_amm || 0;
                    document.getElementById('live-stat-esp').innerText = asta.stat_esp || 0;
                    document.getElementById('live-stat-fvm').innerText = asta.fvm;

                    const feedEl = document.getElementById('live-feed-rilanci');
                    if (asta.ultimi_rilanci && asta.ultimi_rilanci.length > 0) {
                        feedEl.innerHTML = asta.ultimi_rilanci.map(r => `
                            <div class="bg-gray-950 p-2 rounded border border-gray-800 flex justify-between items-center text-sm">
                                <span class="text-blue-300 font-bold truncate">${r.squadra}</span>
                                <span class="text-green-400 font-mono font-bold">${r.prezzo} cr.</span>
                            </div>
                        `).join('');
                    } else {
                        feedEl.innerHTML = '<div class="text-gray-500 italic text-center py-4">Nessun rilancio</div>';
                    }

                    if (asta.fine_timer !== ultimoTimerScadenza) {
                        ultimoTimerScadenza = asta.fine_timer;
                        clearInterval(countdownInterval);
                        countdownInterval = setInterval(() => {
                            const rimanenti = ultimoTimerScadenza - Math.floor(Date.now() / 1000);
                            const timerEl = document.getElementById('live-timer');
                            if (rimanenti > 0) {
                                timerEl.innerText = `00:${rimanenti < 10 ? '0' : ''}${rimanenti}`;
                                if (rimanenti <= 3 && rimanenti !== ultimoSecondoSuonato) {
                                    ultimoSecondoSuonato = rimanenti;
                                    playSound('tick');
                                }
                            } else { 
                                timerEl.innerText = "FINITA!"; 
                                if (!giocatoSuonoFine) {
                                    giocatoSuonoFine = true;
                                    playSound('end');
                                }
                                clearInterval(countdownInterval); 
                            }
                        }, 200); 
                    }
                } else { 
                    modalLive.classList.add('hidden'); 
                    ultimoTimerScadenza = 0;
                    ultimoIdGiocatoreInAsta = null;
                    giocatoSuonoFine = false;
                    ultimoSecondoSuonato = -1;
                    clearInterval(countdownInterval);
                }
            } catch (e) {}
        }, 500);

        async function aggiornaDatiPesanti() {
            try {
                const resSquadre = await fetch('/api/stato_squadre');
                const squadre = await resSquadre.json();
                document.getElementById('griglia-squadre').innerHTML = squadre.map(s => {
                    const statsHTML = ['P', 'D', 'C', 'A'].map(r => `
                        <div class="text-center bg-gray-900 rounded p-1">
                            <div class="text-xs font-bold ${getColorRuolo(r)}">${r}: ${s.stats_ruoli[r].count}/${s.stats_ruoli[r].max}</div>
                            <div class="text-[10px] text-gray-400">${s.stats_ruoli[r].perc}%</div>
                        </div>
                    `).join('');
                    const giocatoriHtml = s.rosa.map(g => `
                        <div class="flex justify-between text-xs border-b border-gray-800 py-0.5">
                            <span class="font-medium ${getColorRuolo(g.ruolo)} truncate pr-1">[${g.ruolo}] <span class="text-gray-300">${g.nome}</span></span>
                            <span class="text-green-400 font-bold shrink-0">${g.costo}</span>
                        </div>
                    `).join('');
                    return `
                    <div class="bg-gray-800 p-2.5 rounded-lg shadow border border-gray-700 flex flex-col h-full justify-between">
                        <div>
                            <div class="flex justify-between items-center mb-1 border-b border-gray-700 pb-1">
                                <h3 class="font-bold text-sm text-white truncate">${s.nome}</h3>
                                <span class="text-xs font-mono text-blue-300">${s.crediti_residui} cr</span>
                            </div>
                            <div class="flex justify-between text-[11px] text-gray-400 mb-1">
                                <span>Max: <strong class="text-red-400">${s.offerta_max}</strong></span>
                                <span>Speso: ${s.perc_totale}%</span>
                            </div>
                            <div class="w-full bg-gray-700 rounded-full h-1.5 mb-2">
                                <div class="bg-blue-500 h-1.5 rounded-full" style="width: ${s.perc_totale}%"></div>
                            </div>
                            <div class="grid grid-cols-4 gap-1 mb-2">${statsHTML}</div>
                        </div>
                        <div class="flex-1 overflow-y-auto pr-1 custom-scrollbar bg-gray-900 p-1.5 rounded max-h-32 min-h-[5rem]">
                            ${giocatoriHtml || '<div class="text-[11px] text-gray-500 italic text-center mt-2">Nessun giocatore</div>'}
                        </div>
                    </div>`;
                }).join('');

                const resAcquisti = await fetch('/api/ultimi_acquisti');
                const acquisti = await resAcquisti.json();
                document.getElementById('lista-acquisti').innerHTML = acquisti.slice(0, 4).map(a => `
                    <div class="bg-gray-700 p-2 rounded text-xs border border-gray-600 flex justify-between items-center">
                        <div><span class="font-bold ${getColorRuolo(a.ruolo)}">[${a.ruolo}]</span> <span class="text-white">${a.nome}</span><div class="text-[10px] text-blue-300">${a.squadra}</div></div>
                        <span class="text-green-400 font-bold text-sm">${a.costo} cr.</span>
                    </div>`).join('');
                
                const urlSvincolati = ultimoRuoloChiamato ? `/api/top_svincolati?ruolo=${ultimoRuoloChiamato}` : '/api/top_svincolati';
                const resSvincolati = await fetch(urlSvincolati);
                const svincolati = await resSvincolati.json();
                
                const titoloEl = document.getElementById('titolo-svincolati');
                if (titoloEl) {
                    titoloEl.innerHTML = ultimoRuoloChiamato 
                        ? `🔥 Top Svincolati <span class="${getColorRuolo(ultimoRuoloChiamato)} font-black">[${ultimoRuoloChiamato}]</span>`
                        : `🔥 Top Svincolati (FVM)`;
                }

                document.getElementById('lista-svincolati').innerHTML = svincolati.slice(0, 4).map(g => `
                    <div class="bg-gray-900 p-2 rounded text-xs border border-blue-900 flex justify-between items-center">
                        <div><span class="font-bold ${getColorRuolo(g.ruolo)}">[${g.ruolo}]</span> <span class="text-gray-300">${g.nome}</span></div>
                        <span class="text-[10px] bg-blue-900 px-1.5 py-0.5 rounded text-green-400 font-bold">FVM: ${g.fvm}</span>
                    </div>`).join('');
            } catch (e) {}
        }

        aggiornaDatiPesanti();
        setInterval(aggiornaDatiPesanti, 4000); 
    </script>
</body>
</html>
